name: cyberdeck_app
description: CyberDeck orchestrator controller (BLE)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.35.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/cyberdeck_icon.png"
  adaptive_icon_background: "#0A0E12"
  adaptive_icon_foreground: "assets/icon/cyberdeck_icon_fg.png"
  min_sdk_android: 21
