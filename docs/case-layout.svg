<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .mod   { stroke:#333; stroke-width:1.5; }
    .name  { font-size:16px; font-weight:700; fill:#1a1a1a; }
    .desc  { font-size:11px; fill:#444; }
    .alias { font-size:10px; fill:#777; font-style:italic; }
    .h     { font-size:20px; font-weight:700; fill:#1a1a1a; }
    .sub   { font-size:12px; fill:#666; }
    .key   { font-size:12.5px; fill:#333; }
    .cap   { font-size:11px; fill:#888; }
    .plabel{ font-size:10.5px; font-weight:700; }
  </style>

  <rect width="980" height="620" fill="#ffffff"/>
  <text x="30" y="40" class="h">CyberDeck — modules in the storage case</text>
  <text x="30" y="60" class="sub">Top-down plan of the 22 × 22 cm clamshell interior. Schematic, not to scale — foam is cut once parts are measured.</text>

  <!-- Case interior -->
  <rect x="40" y="82" width="470" height="500" rx="12" fill="#EEF3F8" stroke="#2B6CB0" stroke-width="2.5"/>
  <text x="56" y="103" class="desc" font-weight="700" fill="#2B6CB0">TOP SECTION — modules</text>
  <!-- hinge -->
  <line x1="40" y1="82" x2="40" y2="582" stroke="#B07A0E" stroke-width="4" stroke-dasharray="7 5"/>
  <text x="30" y="332" class="cap" fill="#B07A0E" transform="rotate(-90 30 332)" text-anchor="middle">hinge — lid folds here</text>

  <!-- ===== Modules (top section) ===== -->
  <!-- SPECTRE -->
  <rect x="52" y="116" width="150" height="150" rx="8" class="mod" fill="#C9D8EE"/>
  <text x="62" y="140" class="name">SPECTRE</text>
  <text x="62" y="158" class="desc">ESP32-DIV handheld</text>
  <text x="62" y="173" class="desc">ESP32 + 2.4" TFT + GPS</text>
  <text x="62" y="188" class="desc">+ radio shield (NRF24×3</text>
  <text x="62" y="201" class="desc">+ CC1101), U.FL antenna</text>
  <text x="62" y="252" class="alias">alias: HUB</text>

  <!-- SENTINEL -->
  <rect x="212" y="116" width="150" height="150" rx="8" class="mod" fill="#D8CEE9"/>
  <text x="222" y="140" class="name">SENTINEL</text>
  <text x="222" y="158" class="desc">Passive watcher</text>
  <text x="222" y="173" class="desc">(never transmits)</text>
  <text x="222" y="188" class="desc">ESP32-C3 + UNO R3</text>
  <text x="222" y="201" class="desc">+ 3.5" TFT readout</text>
  <text x="222" y="252" class="alias">alias: WIFI-NODE + READOUT</text>

  <!-- BEACON -->
  <rect x="372" y="116" width="126" height="150" rx="8" class="mod" fill="#F2D7A6"/>
  <text x="382" y="140" class="name">BEACON</text>
  <text x="382" y="158" class="desc">Removable</text>
  <text x="382" y="172" class="desc">logging watch</text>
  <text x="382" y="188" class="desc">ESP32-C3</text>
  <text x="382" y="202" class="desc">+ 128×64 OLED</text>
  <text x="382" y="252" class="alias">alias: STATUS</text>

  <!-- ===== Power cables (modules -> hub ports) ===== -->
  <g stroke="#B07A0E" stroke-width="2.5" fill="none">
    <path d="M122,266 L122,324"/>   <!-- SPECTRE -->
    <path d="M252,266 L252,324"/>   <!-- SENTINEL C3 -->
    <path d="M312,266 L312,324"/>   <!-- SENTINEL UNO -->
    <path d="M435,266 L435,324"/>   <!-- BEACON -->
  </g>
  <text x="408" y="296" class="cap" fill="#B07A0E">own USB cable each</text>

  <!-- ===== USB hub (middle, ports up) ===== -->
  <rect x="66" y="326" width="418" height="40" rx="6" class="mod" fill="#DCE8F3" stroke="#2B6CB0"/>
  <!-- ports on top edge, facing up -->
  <g fill="#333">
    <rect x="117" y="320" width="10" height="6"/>
    <rect x="175" y="320" width="10" height="6"/>
    <rect x="247" y="320" width="10" height="6"/>
    <rect x="307" y="320" width="10" height="6"/>
    <rect x="370" y="320" width="10" height="6"/>
    <rect x="430" y="320" width="10" height="6"/>
  </g>
  <text x="275" y="344" class="name" font-size="15px" text-anchor="middle">USB hub</text>
  <text x="275" y="359" class="desc" text-anchor="middle">across the middle · ports face up · powers every module</text>

  <!-- ===== 2 power lines up the RHS ===== -->
  <g stroke="#C8392B" stroke-width="3" fill="none">
    <path d="M470,432 L470,352 L484,352"/>
    <path d="M482,432 L482,346 L484,346"/>
  </g>
  <circle cx="484" cy="352" r="3" fill="#C8392B"/>
  <circle cx="484" cy="346" r="3" fill="#C8392B"/>
  <text x="476" y="400" class="plabel" fill="#C8392B" text-anchor="middle" transform="rotate(-90 476 400)">2 power lines (RHS)</text>

  <!-- ===== Power (bottom section) ===== -->
  <rect x="52" y="430" width="446" height="138" rx="8" fill="#F9DCCF" stroke="#C8392B" stroke-width="1.8"/>
  <text x="64" y="452" class="desc" font-weight="700" fill="#C8392B">BOTTOM SECTION — power (fills the whole bottom)</text>
  <rect x="64" y="462" width="134" height="96" rx="6" class="mod" fill="#F4C7B8"/>
  <text x="131" y="506" class="name" font-size="14px" text-anchor="middle">Powerbank</text>
  <text x="131" y="524" class="desc" text-anchor="middle">main cell</text>
  <rect x="206" y="462" width="134" height="96" rx="6" class="mod" fill="#F4C7B8"/>
  <text x="273" y="500" class="name" font-size="14px" text-anchor="middle">18650 cells</text>
  <text x="273" y="518" class="desc" text-anchor="middle">3× in holders</text>
  <text x="273" y="533" class="desc" text-anchor="middle">(1S3P)</text>
  <rect x="348" y="462" width="138" height="96" rx="6" class="mod" fill="#F4C7B8"/>
  <text x="417" y="500" class="name" font-size="14px" text-anchor="middle">Charging</text>
  <text x="417" y="518" class="name" font-size="14px" text-anchor="middle">station</text>
  <text x="417" y="535" class="desc" text-anchor="middle">boost + charge</text>

  <!-- ===== Legend ===== -->
  <rect x="540" y="82" width="410" height="500" rx="12" fill="#F7F3E3" stroke="#333" stroke-width="1.5"/>
  <text x="560" y="114" class="h" font-size="17px">Module names</text>
  <text x="560" y="138" class="key"><tspan font-weight="700">SPECTRE</tspan> — active ESP32-DIV handheld</text>
  <text x="560" y="159" class="key"><tspan font-weight="700">SENTINEL</tspan> — passive always-on watcher</text>
  <text x="560" y="180" class="key"><tspan font-weight="700">BEACON</tspan> — removable logging watch</text>
  <text x="560" y="201" class="key"><tspan font-weight="700">CONSOLE</tspan> — phone app (not stored in the case)</text>
  <text x="560" y="222" class="key"><tspan font-weight="700">RELAY</tspan> — spare board, not in the build</text>

  <line x1="560" y1="242" x2="930" y2="242" stroke="#ccc" stroke-width="1"/>
  <text x="560" y="268" class="key" font-weight="700">Power &amp; wiring</text>
  <text x="560" y="290" class="cap" font-size="12px">• Bottom section is full of power: the powerbank,</text>
  <text x="572" y="306" class="cap" font-size="12px">the 3× 18650 pack and the charging station.</text>
  <text x="560" y="328" class="cap" font-size="12px">• Two power lines run up the right-hand side into</text>
  <text x="572" y="344" class="cap" font-size="12px">the top section to feed the USB hub.</text>
  <text x="560" y="366" class="cap" font-size="12px">• The USB hub sits across the middle, ports facing</text>
  <text x="572" y="382" class="cap" font-size="12px">up into the top section.</text>
  <text x="560" y="404" class="cap" font-size="12px">• Each module above plugs into the hub with its</text>
  <text x="572" y="420" class="cap" font-size="12px">own power cable — SENTINEL uses two (C3 + UNO).</text>
  <text x="560" y="442" class="cap" font-size="12px">• CONSOLE (the phone) is carried by the operator.</text>

  <line x1="560" y1="462" x2="930" y2="462" stroke="#ccc" stroke-width="1"/>
  <text x="560" y="486" class="cap" font-size="11px">Case numbers: 220 mm outer, 25 mm per half, 165 mm</text>
  <text x="560" y="502" class="cap" font-size="11px">hinge-to-handle (measured); inner width ~205 mm (not</text>
  <text x="560" y="518" class="cap" font-size="11px">yet measured). Positions are a plan, not final.</text>
  <text x="560" y="544" class="cap" font-size="11px">Retired: Raspberry Pi 5 hub, 7" panel + RTD2660 driver,</text>
  <text x="560" y="560" class="cap" font-size="11px">RTL-SDR, ESP32-S3 hub.</text>
  <text x="560" y="574" class="cap" font-size="11px" font-style="italic">War-rig-phantom · hardware-layout.md</text>
</svg>
